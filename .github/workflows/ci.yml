name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp:
    name: C++20 Release and UBSan-trap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make test CXX=g++

  python:
    name: Python 3.12 nanobind tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2' nanobind
      - run: make python PYTHON=python
      - run: python -B python/test_python_parity.py --self-contained
